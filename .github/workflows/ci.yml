name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  packages:
    name: Build ${{ matrix.codename }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:26.04", codename: resolute }
          - { image: "ubuntu:24.04", codename: noble }
          - { image: "debian:13", codename: trixie }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Builds the .deb files, runs the unit tests and lintian.
      - run: scripts/build-deb.sh "${{ matrix.image }}" "${{ matrix.codename }}" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debs-${{ matrix.codename }}
          path: dist/*.deb
          if-no-files-found: error

  editor:
    name: GTK editors
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential meson pkgconf libnm-dev libnma-gtk4-dev libgtk-4-dev libglib2.0-dev \
            libnma-dev libgtk-3-dev libgtk-3-bin gir1.2-gtk-3.0 \
            python3-gi python3-pytest python3-cryptography gir1.2-nm-1.0 gir1.2-gtk-4.0 libgtk-4-bin
      - name: Test the editors under a headless display
        env:
          OPENVPN3_EDITOR_TEST_REQUIRED: "1"
          GDK_BACKEND: broadway
        run: |
          meson setup build
          ninja -C build
          gtk4-broadwayd :5 &
          broadwayd :6 &
          sleep 1
          BROADWAY_DISPLAY=:5 OPENVPN3_PLUGIN_DIR="$PWD/build" \
            python3 -m pytest -v -p no:cacheprovider tests/unit/test_editor.py
          BROADWAY_DISPLAY=:6 OPENVPN3_EDITOR_GTK=3 OPENVPN3_PLUGIN_DIR="$PWD/build" \
            python3 -m pytest -v -p no:cacheprovider tests/unit/test_editor.py

  integration:
    name: Integration (noble)
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debs-noble
          path: dist
      - run: sudo tests/integration/run.sh "$PWD/dist"
