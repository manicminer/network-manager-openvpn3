name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: debs-*
          merge-multiple: true
          path: dist

      - name: Check that the tag matches debian/changelog
        run: |
          version=$(dpkg-parsechangelog -S Version)
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match changelog version $version" >&2; exit 1; }

      - name: Source tarball
        run: |
          git archive --format=tar.gz --prefix="network-manager-openvpn3-${TAG#v}/" \
            -o "dist/network-manager-openvpn3-${TAG#v}.tar.gz" "$TAG"

      - name: Import the signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "APT_SIGNING_KEY secret is not set" >&2; exit 1; }
          gpg --batch --import <<<"$APT_SIGNING_KEY"
          fpr=$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          [ "$fpr" = "$(gpg --with-colons --show-keys keys/network-manager-openvpn3.asc | awk -F: '/^fpr/{print $10; exit}')" ] \
            || { echo "secret key does not match keys/network-manager-openvpn3.asc" >&2; exit 1; }
          echo "SIGNING_KEY=$fpr" >> "$GITHUB_ENV"

      - name: Checksums and signature
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          cd dist
          sha256sum -- *.deb *.tar.gz > SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --local-user "$SIGNING_KEY" \
            --armor --detach-sign -o SHA256SUMS.asc SHA256SUMS 3<<<"$GPG_PASSPHRASE"
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Draft release
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.asc keys/network-manager-openvpn3.asc

      # Attestations exist for public repositories only.
      - name: Attest packages
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
      - name: Attest checksums
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      - name: APT repository
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: scripts/build-apt-repo.sh dist site "$SIGNING_KEY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "${{ github.ref_name }}" --draft=false -R "${{ github.repository }}"
